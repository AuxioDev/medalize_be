# Restricts /admin/ to trusted IPs. Add one `allow` line per trusted IP or
# CIDR below, then reload nginx (`docker compose exec nginx nginx -s reload`
# or `docker compose restart nginx`). Until you do, /admin/ is unreachable
# from anywhere — a safe default rather than open to the whole internet,
# since it's the only console that verifies doctors and holds full PII.
#
# allow 203.0.113.42;      # e.g. your office/VPN egress IP
# allow 198.51.100.0/24;   # e.g. a trusted office subnet
deny all;
