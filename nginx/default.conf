# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Place symlinks or copies of your Let's Encrypt certs here:
    #   ln -s /etc/letsencrypt/live/<domain>/fullchain.pem nginx/certs/fullchain.pem
    #   ln -s /etc/letsencrypt/live/<domain>/privkey.pem  nginx/certs/privkey.pem
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow large file uploads (diploma PDFs, avatars)
    client_max_body_size 20M;

    # Serves uploaded avatars/diplomas straight from disk (shared volume with
    # the web container) instead of proxying binary files through gunicorn.
    # Only relevant when USE_CLOUDINARY is unset — once Cloudinary is
    # configured, avatar_url points at Cloudinary's CDN and this is unused.
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django Admin is the only doctor-verification console and holds full PII
    # (diplomas, patient/doctor records) — restrict it to trusted IPs on top
    # of the normal login. See admin_allowlist.conf; unreachable by default
    # until that file is filled in.
    location /admin/ {
        include /etc/nginx/admin_allowlist.conf;

        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }
}
