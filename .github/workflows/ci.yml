name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medalize_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Must be ≥50 chars and distinct from each other — config/settings.py
      # enforces this unconditionally (see _validate_secret/_validate_secrets_distinct),
      # so short placeholder secrets fail at Django import time, not just in prod.
      SECRET_KEY: ci-secret-key-not-for-production-use-only-padding-to-reach-fifty-chars
      JWT_SECRET_KEY: ci-jwt-secret-not-for-production-use-only-padding-to-reach-fifty-chars
      DEBUG: 'True'
      DB_NAME: medalize_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # test_settings swaps cache/email to in-process backends so CI doesn't
        # need a Redis/SMTP service alongside Postgres.
        run: python manage.py test --settings=config.test_settings
