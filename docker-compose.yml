# Full stack: API + Postgres + Redis + Celery worker + Nginx (TLS).
#
# Setup on a fresh VPS:
#   1. cp .env.example .env  (fill SECRET_KEY, JWT_SECRET_KEY, DB_PASSWORD, REDIS_PASSWORD, …)
#   2. mkdir -p nginx/certs
#   3. docker compose up --build -d web db redis   # start without nginx first
#   4. certbot certonly --standalone -d yourdomain.com
#      # Places certs in /etc/letsencrypt/live/yourdomain.com/
#   5. ln -s /etc/letsencrypt/live/yourdomain.com/fullchain.pem nginx/certs/fullchain.pem
#      ln -s /etc/letsencrypt/live/yourdomain.com/privkey.pem  nginx/certs/privkey.pem
#   6. docker compose up -d nginx
#   7. docker compose exec web python manage.py seed_data --clear   # optional test data
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-medalize_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      # No fallback: a silently-applied "postgres" password on a real DB is
      # exactly the kind of misconfiguration that should fail loud at
      # startup, not work by accident (see SECRET_KEY/JWT_SECRET_KEY in
      # config/settings.py for the same fail-loud pattern).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
    volumes:
      # Persists uploaded avatars/diplomas across rebuilds and lets nginx
      # serve them directly (see nginx/default.conf). Only used when
      # USE_CLOUDINARY is unset — irrelevant once Cloudinary is configured,
      # but harmless to keep mounted either way.
      - media_data:/app/media
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3"
    # Port 8000 is NOT exposed to the host — nginx is the only entry point.
    # For local development without nginx, temporarily add: ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/admin_allowlist.conf:/etc/nginx/admin_allowlist.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
    command: celery -A config worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Scheduled tasks: appointment reminders, auto-complete past appointments
  # (see CELERY_BEAT_SCHEDULE in config/settings.py).
  beat:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
    command: celery -A config beat -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media_data:
